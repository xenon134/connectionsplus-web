<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connections — The New York Times</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <button class="iconbtn" id="games-btn" aria-label="All games" aria-expanded="false" aria-controls="games-drawer">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <a class="wordmark" href="#">
        <span class="wordmark__t">T</span>
        <span class="wordmark__games">Games</span>
      </a>
    </div>
    <div class="topbar__right">
      <a class="btn btn--subscribe" href="#">Subscribe</a>
      <a class="btn btn--login" href="#">Log In</a>
      <button class="iconbtn" id="theme-btn" aria-label="Theme: System" title="Theme: System">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 20.5h7M12 17v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="games-backdrop" class="games-backdrop" hidden></div>
  <aside id="games-drawer" class="games-drawer" aria-label="All games" aria-hidden="true" hidden>
    <div class="games-drawer__head">
      <span class="games-drawer__title">Games</span>
      <button type="button" class="games-drawer__close" id="games-close" aria-label="Close games menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="games-list" aria-label="Games">
      <a href="./" class="game-card" data-game="connections" aria-current="page">
        <span class="game-card__icon">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <rect x="4" y="4" width="88" height="88" rx="10" fill="#F7F7F2"/>
            <g stroke="#121212" stroke-width="3" stroke-linejoin="round">
              <rect x="12" y="12" width="44" height="15" rx="3" fill="#BA81C5"/>
              <rect x="60" y="12" width="24" height="15" rx="3" fill="#BA81C5"/>
              <rect x="12" y="31" width="24" height="15" rx="3" fill="#BA81C5"/>
              <rect x="40" y="31" width="44" height="15" rx="3" fill="#BA81C5"/>
              <rect x="12" y="50" width="44" height="15" rx="3" fill="#BA81C5"/>
              <rect x="60" y="50" width="24" height="15" rx="3" fill="#BA81C5"/>
              <rect x="12" y="69" width="24" height="15" rx="3" fill="#BA81C5"/>
              <rect x="40" y="69" width="44" height="15" rx="3" fill="#BA81C5"/>
            </g>
          </svg>
        </span>
        <span class="game-card__copy">
          <span class="game-card__title">Connections</span>
          <span class="game-card__desc">Group words that share a common thread.</span>
        </span>
      </a>
      <a href="#" class="game-card" data-game="odd-one" data-coming-soon>
        <span class="game-card__icon">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <rect x="4" y="4" width="88" height="88" rx="10" fill="#F7F7F2"/>
            <g stroke="#121212" stroke-width="3" stroke-linejoin="round">
              <rect x="18" y="18" width="24" height="24" rx="5" fill="#BA81C5"/>
              <rect x="54" y="18" width="24" height="24" rx="5" fill="#BA81C5"/>
              <rect x="18" y="54" width="24" height="24" rx="5" fill="#BA81C5"/>
              <rect x="54" y="54" width="24" height="24" rx="5" fill="#F9DF6D"/>
            </g>
          </svg>
        </span>
        <span class="game-card__copy">
          <span class="game-card__title">Odd One</span>
          <span class="game-card__desc">Find the odd word.</span>
        </span>
      </a>
    </nav>
  </aside>

  <main class="page">
    <div class="game-head">
      <div class="game-head__meta">
        <h1 class="game-head__title">Connections</h1>
        <div class="game-head__date">
          <button type="button" class="date-nav" id="prev" aria-label="Previous puzzle">&lt;</button>
          <span id="date">October 10, 2026</span>
          <button type="button" class="date-nav" id="next" aria-label="Next puzzle">&gt;</button>
        </div>
      </div>
      <div class="game-head__actions">
        <button class="iconbtn" aria-label="Hint">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="iconbtn" id="stats-btn" aria-label="Statistics">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 19V11M12 19V5M18 19v-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
        <button class="iconbtn" aria-label="How to play">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.6 2.5c-.7.3-1 .9-1 1.6v.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17" r="1.05" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <article class="board">
      <h2 class="board__prompt">Create four groups of four!</h2>
      <form id="game" class="board__form" autocomplete="off">
        <div class="stack">
          <div id="solved" class="solvedstack" aria-live="polite"></div>
          <div id="tiles" class="grid" role="group" aria-label="Select four items that share something in common"></div>
        </div>
      </form>
      <section class="mistakes">
        <span class="mistakes__label">Mistakes Remaining:</span>
        <span id="dots" class="mistakes__dots" aria-hidden="true"></span>
      </section>
      <section class="controls">
        <button type="button" id="shuffle" class="pill pill--active">Shuffle</button>
        <button type="button" id="deselect" class="pill" disabled>Deselect All</button>
        <button type="button" id="organize" class="pill" disabled>Organize</button>
        <button type="button" id="submit" class="pill" disabled>Submit</button>
      </section>
      <section class="controls-sub" id="giveup-row" hidden>
        <button type="button" id="giveup" class="pill pill--giveup">Give Up</button>
      </section>
    </article>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <div id="results-modal" class="modal-backdrop" aria-hidden="true" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 id="modal-title" class="modal__title">Nice try!</h2>
        <button type="button" id="modal-close" class="modal__close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="modal-grid" class="modal__grid"></div>
      <div class="modal__actions">
        <button type="button" id="modal-share" class="modal-btn modal-btn--share">Share</button>
        <button type="button" id="modal-share-guesses" class="modal-btn modal-btn--guesses" hidden>Share Guesses</button>
        <button type="button" id="modal-continue" class="modal-btn modal-btn--continue">Continue Playing</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
